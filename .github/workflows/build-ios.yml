name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Installa dipendenze
      run: npm install

    - name: Sincronizza Capacitor
      run: |
        npx cap copy
        npx cap sync ios

    - name: Imposta Xcode 26.6
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Pulisci la cache di build
      run: rm -rf ~/Library/Developer/Xcode/DerivedData

    - name: Verifica destinazioni valide
      run: xcodebuild -showdestinations -workspace ios/App/App.xcodeproj/project.xcworkspace -scheme App

    - name: Compila per Simulatore e archivia
      run: |
            xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace -scheme App -destination 'platform=iOS Simulator,name=iPhone 16' build
            mkdir -p Payload
            cp -R build/Release-iphonesimulator/App.app Payload/
            zip -r App.ipa Payload

    - name: Carica l'artefatto
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-build
        path: ios/App/DerivedData/Build/build/ios/*.ipa
