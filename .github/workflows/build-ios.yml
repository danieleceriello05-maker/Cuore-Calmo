name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Installa dipendenze
      run: npm install

    - name: Sincronizza Capacitor
      run: |
        npx cap copy
        npx cap sync ios

    - name: Imposta Xcode 26.6
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Pulisci la cache di build
      run: rm -rf ~/Library/Developer/Xcode/DerivedData
 
    - name: Compila per il simulatore
      run: |
                xcodebuild -workspace ios/App/App.xcodeproj/project.xcworkspace \
                -scheme App \
                -configuration Debug \
                -destination 'generic/platform=iOS Simulator' \
                -derivedDataPath build \
                SYMROOT=$(pwd)/build \
                build

    - name: Prepara ed impacchetta IPA
      run: |
        mkdir -p Payload
        cp -r build/Debug-iphonesimulator/App.app Payload/
        zip -r App.ipa Payload
          
    - name: Rinomina l'IPA
      run: mv App.ipa cuore-calmo.ipa
        
    - name: Carica l'IPA su GitHub
      uses: actions/upload-artifact@v4
      with:
            name: CuoreCalmo
            path: cuore-calmo.ipa
